name: Profil kartını güncelle

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (TR)
  workflow_dispatch:
  push:
    paths: ["scripts/gen_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kartı üret
        env:
          # STATS_TOKEN tanımlıysa onu, yoksa Actions'ın kendi token'ını kullan
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py assets
      - name: Değiştiyse commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet || { git commit -m "Profil kartı: $(date -u +%F)"; git push; }
