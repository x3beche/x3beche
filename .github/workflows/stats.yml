name: Update stats cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 06:17 Istanbul
  workflow_dispatch:
  push:
    paths: ["scripts/gen_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate card
        env:
          # STATS_TOKEN if set, else the Actions token
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py assets
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.svg
          git diff --cached --quiet || { git commit -m "Stats card: $(date -u +%F)"; git push; }
